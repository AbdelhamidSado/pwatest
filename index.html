<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Calculadora científica inteligente con historial en la nube.">
  <meta name="theme-color" content="#6C63FF">

  <!-- PWA meta tags para Android e iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calcula">
  <meta name="application-name" content="Calcula">

  <!-- Enlace al manifiesto PWA -->
  <link rel="manifest" href="manifest.json">

  <title>Calcula · App PWA</title>

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #6C63FF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* ── Splash de carga ── */
    #splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(160deg, #6C63FF 0%, #4B44CC 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      z-index: 100;
      transition: opacity .45s ease;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Ilustración Memphis mini */
    .splash-illo {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: .5rem;
    }

    .splash-illo svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Shapes flotantes */
    .f1 {
      animation: f1 2.8s ease-in-out infinite;
    }

    .f2 {
      animation: f2 3.2s ease-in-out infinite .3s;
    }

    .f3 {
      animation: f3 2.5s ease-in-out infinite .6s;
    }

    @keyframes f1 {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-8px)
      }
    }

    @keyframes f2 {

      0%,
      100% {
        transform: translateY(0) rotate(0deg)
      }

      50% {
        transform: translateY(-6px) rotate(8deg)
      }
    }

    @keyframes f3 {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.1)
      }
    }

    .splash-logo {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -.04em;
      display: flex;
      align-items: center;
      gap: .3rem;
    }

    .splash-dot {
      width: 10px;
      height: 10px;
      background: #FFD3B6;
      border-radius: 50%;
      display: inline-block;
      animation: dotBounce 1.3s ease-in-out infinite;
    }

    @keyframes dotBounce {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-7px) scale(1.2);
      }
    }

    .splash-tagline {
      font-size: .85rem;
      color: rgba(255, 255, 255, .65);
      margin-top: -.8rem;
    }

    .splash-bar-wrap {
      width: 150px;
      height: 3px;
      background: rgba(255, 255, 255, .18);
      border-radius: 3px;
      overflow: hidden;
    }

    .splash-bar {
      height: 100%;
      background: rgba(255, 255, 255, .75);
      border-radius: 3px;
      animation: barAnim 1.7s ease-in-out infinite;
    }

    @keyframes barAnim {
      0% {
        width: 0%;
        margin-left: 0%;
      }

      50% {
        width: 55%;
        margin-left: 22%;
      }

      100% {
        width: 0%;
        margin-left: 100%;
      }
    }

    /* ── Iframe principal ── */
    #calc-iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
    }

    /* ── Banner Flotante de Instalación PWA ── */
    #pwa-banner {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 27, 46, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff;
      padding: .75rem 1.2rem .75rem 1rem;
      border-radius: 50px;
      font-size: .85rem;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: .7rem;
      z-index: 90;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .35);
      white-space: nowrap;
      animation: bannerIn .4s cubic-bezier(.34, 1.36, .64, 1);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    @keyframes bannerIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    #btn-install {
      background: #6C63FF;
      color: #fff;
      border: none;
      padding: .45rem 1.1rem;
      border-radius: 50px;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(108, 99, 255, .4);
      transition: transform .15s ease, background .15s ease;
    }

    #btn-install:active {
      transform: scale(0.95);
    }

    #btn-install:hover {
      background: #574ebd;
    }

    #btn-dismiss {
      background: none;
      border: none;
      color: rgba(255, 255, 255, .5);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 .2rem;
    }

    #btn-dismiss:hover {
      color: #fff;
    }

    /* ── Modal de Guía de Instalación Android / iOS ── */
    #install-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 12, 28, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      animation: fadeIn .25s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .install-card {
      background: #fff;
      color: #1E1B2E;
      border-radius: 24px;
      padding: 1.6rem 1.4rem;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .3);
      position: relative;
      animation: popUp .3s cubic-bezier(.34, 1.36, .64, 1);
      text-align: center;
    }

    @keyframes popUp {
      from {
        opacity: 0;
        transform: scale(0.88) translateY(20px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #F4F3FF;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: bold;
      color: #6C63FF;
      cursor: pointer;
    }

    .install-icon-badge {
      width: 64px;
      height: 64px;
      background: #6C63FF;
      border-radius: 18px;
      margin: 0 auto 1rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.8rem;
      box-shadow: 0 8px 20px rgba(108, 99, 255, 0.35);
    }

    .install-card h3 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #1E1B2E;
      margin-bottom: .4rem;
    }

    .install-card p {
      font-size: .85rem;
      color: #6E6D7A;
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    .steps-list {
      text-align: left;
      background: #F8F7FF;
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .8rem;
      margin-bottom: 1.2rem;
      border: 1px solid #EAE8FF;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: .7rem;
      font-size: .85rem;
      color: #2D2B3D;
      line-height: 1.35;
    }

    .step-num {
      background: #6C63FF;
      color: #fff;
      font-weight: 800;
      font-size: .75rem;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .btn-understand {
      width: 100%;
      background: #6C63FF;
      color: #fff;
      border: none;
      padding: .85rem;
      border-radius: 14px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(108, 99, 255, .3);
    }
  </style>
</head>

<body>

  <!-- Splash de carga -->
  <div id="splash">
    <div class="splash-illo" aria-hidden="true">
      <svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
        <circle cx="45" cy="45" r="40" fill="rgba(255,255,255,.1)" />
        <g class="f1">
          <circle cx="18" cy="18" r="10" fill="#FFD3B6" opacity=".8" />
        </g>
        <g class="f2">
          <rect x="60" y="12" width="16" height="16" rx="4" fill="#A8E6CF" opacity=".8" />
        </g>
        <g class="f3">
          <polygon points="72,65 80,78 64,78" fill="#FFE566" opacity=".7" />
        </g>
        <rect x="28" y="25" width="34" height="42" rx="7" fill="white" opacity=".95" />
        <rect x="33" y="31" width="24" height="12" rx="4" fill="#EAE8FF" />
        <text x="45" y="41" text-anchor="middle" font-size="8" font-weight="700" fill="#6C63FF"
          font-family="monospace">42</text>
        <circle cx="36" cy="52" r="3.5" fill="#FFD3B6" />
        <circle cx="45" cy="52" r="3.5" fill="#A8E6CF" />
        <circle cx="54" cy="52" r="3.5" fill="#C9C0FF" />
        <circle cx="36" cy="61" r="3.5" fill="#C9C0FF" />
        <circle cx="45" cy="61" r="3.5" fill="#C9C0FF" />
        <circle cx="54" cy="61" r="3.5" fill="#6C63FF" />
      </svg>
    </div>
    <div class="splash-logo">✦ Calcula<span class="splash-dot"></span></div>
    <p class="splash-tagline">Tus cálculos, siempre en la nube</p>
    <div class="splash-bar-wrap">
      <div class="splash-bar"></div>
    </div>
  </div>

  <!-- Iframe principal -->
  <iframe id="calc-iframe" style="display:none" allowfullscreen allow="storage-access; clipboard-read; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade" loading="eager" title="Calcula — Calculadora en la Nube">
  </iframe>

  <!-- Banner PWA install -->
  <div id="pwa-banner">
    <span>📲</span>
    <span>Instalá Calcula PWA</span>
    <button id="btn-install">Instalar</button>
    <button id="btn-dismiss" aria-label="Cerrar">✕</button>
  </div>

  <!-- Modal Guía de Instalación Android / iOS -->
  <div id="install-modal-overlay">
    <div class="install-card">
      <button class="modal-close-btn" id="modal-close">✕</button>
      <div class="install-icon-badge">📱</div>
      <h3>Instalar en tu Celular</h3>
      <p>Instalá Calcula como app nativa para acceder directo desde tu pantalla de inicio.</p>

      <div class="steps-list" id="modal-steps">
        <!-- Pasos inyectados dinámicamente según SO -->
      </div>

      <button class="btn-understand" id="btn-modal-ok">Entendido</button>
    </div>
  </div>

  <script>
    // ── URL de la Web App de GAS ──────────────────────────────────
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbyhXYHWynVBK40TdTBhAenuXjUfGSWbKvq78riFNulHwbI1orHbe2LGr5wXyDZ5Fuv2/exec';

    var isEmbedded = (window.self !== window.top);
    var splash = document.getElementById('splash');

    function hideSplash() {
      splash.classList.add('fade-out');
      setTimeout(function () { splash.style.display = 'none'; }, 480);
    }

    if (isEmbedded) {
      // ── MODO IFRAME (Google Sites) ───────────────────────────────
      setTimeout(function () {
        window.location.replace(GAS_URL + '?embedded=true');
      }, 800);

    } else {
      // ── MODO STANDALONE / WRAPPER PWA ─────────────────────────────
      var iframe = document.getElementById('calc-iframe');
      iframe.style.display = 'block';
      iframe.src = GAS_URL + '?embedded=true';

      iframe.addEventListener('load', hideSplash);
      setTimeout(function () {
        if (!splash.classList.contains('fade-out')) hideSplash();
      }, 9000);

      // ── Generador dinámico de íconos PNG en Canvas para Chrome Android ──
      function generatePngIcon(size) {
        try {
          var canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext('2d');
          var r = size * 0.22;

          ctx.fillStyle = '#6C63FF';
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(0, 0, size, size, r);
          else ctx.rect(0, 0, size, size);
          ctx.fill();

          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          var pad = size * 0.24;
          var w = size - pad * 2;
          var h = size * 0.21;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(pad, pad * 0.85, w, h, size * 0.04);
          else ctx.rect(pad, pad * 0.85, w, h);
          ctx.fill();

          ctx.fillStyle = '#6C63FF';
          ctx.font = 'bold ' + Math.round(size * 0.12) + 'px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('42', size / 2, pad * 0.85 + h / 2);

          ctx.fillStyle = '#FFD3B6';
          ctx.beginPath(); ctx.arc(size * 0.37, size * 0.62, size * 0.05, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.beginPath(); ctx.arc(size * 0.50, size * 0.62, size * 0.05, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(size * 0.63, size * 0.62, size * 0.05, 0, Math.PI * 2); ctx.fill();

          return canvas.toDataURL('image/png');
        } catch (e) {
          return null;
        }
      }

      // ── Inyección de Manifiesto Blob PWA con íconos PNG reales ────
      try {
        var png192 = generatePngIcon(192);
        var png512 = generatePngIcon(512);

        var manifestObj = {
          name: 'Calcula · Calculadora en la Nube',
          short_name: 'Calcula',
          description: 'Calculadora científica inteligente con historial en la nube.',
          start_url: location.href,
          scope: './',
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#6C63FF',
          theme_color: '#6C63FF',
          icons: [
            { src: png192 || 'icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: png512 || 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };

        var blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(blob);
        document.head.appendChild(manifestLink);
      } catch (err) { }

      // ── Registro de Service Worker para Android Chrome PWA Audit ──
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () { });
      }

      // ── Control del Banner e Instalador PWA ──────────────────────
      var banner = document.getElementById('pwa-banner');
      var btnInstall = document.getElementById('btn-install');
      var btnDismiss = document.getElementById('btn-dismiss');
      var modalOverlay = document.getElementById('install-modal-overlay');
      var modalClose = document.getElementById('modal-close');
      var btnModalOk = document.getElementById('btn-modal-ok');
      var modalSteps = document.getElementById('modal-steps');
      var deferredPrompt = null;

      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

      // Mostrar banner en móviles no instalados
      if (!isStandalone) {
        banner.style.display = 'flex';
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        banner.style.display = 'flex';
      });

      function showModalGuide() {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
          modalSteps.innerHTML =
            '<div class="step-item"><div class="step-num">1</div><div>Toca el botón <strong>Compartir (⎋)</strong> en la barra inferior de Safari.</div></div>' +
            '<div class="step-item"><div class="step-num">2</div><div>Desplázate hacia abajo y selecciona <strong>"Agregar al inicio (➕)"</strong>.</div></div>' +
            '<div class="step-item"><div class="step-num">3</div><div>Presiona <strong>"Agregar"</strong> arriba a la derecha.</div></div>';
        } else {
          modalSteps.innerHTML =
            '<div class="step-item"><div class="step-num">1</div><div>Toca el menú de opciones <strong>(tres puntos ⋮)</strong> arriba a la derecha en Chrome.</div></div>' +
            '<div class="step-item"><div class="step-num">2</div><div>Selecciona <strong>"Instalar aplicación"</strong> o <strong>"Agregar a la pantalla principal"</strong>.</div></div>' +
            '<div class="step-item"><div class="step-num">3</div><div>Confirma en <strong>"Instalar"</strong> para tenerla como app nativa.</div></div>';
        }
        modalOverlay.style.display = 'flex';
      }

      btnInstall.addEventListener('click', function () {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function (result) {
            if (result.outcome === 'accepted') banner.style.display = 'none';
            deferredPrompt = null;
          });
        } else {
          // Si el navegador no disparó antes el prompt automático, se muestra la guía visual
          showModalGuide();
        }
      });

      btnDismiss.addEventListener('click', function () { banner.style.display = 'none'; });
      modalClose.addEventListener('click', function () { modalOverlay.style.display = 'none'; });
      btnModalOk.addEventListener('click', function () { modalOverlay.style.display = 'none'; });

      window.addEventListener('appinstalled', function () {
        banner.style.display = 'none';
      });
    }

    // Prevenir scroll elástico en iOS
    document.addEventListener('touchmove', function (e) {
      if (e.target === document.body) e.preventDefault();
    }, { passive: false });
  </script>

</body>

</html>
